[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fast-ml-tools"
dynamic = ["version"]
description = "Набор инструментов для быстрой разработки ML-решений"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]

# Базовые зависимости: всё, что импортируется при `import fast_ml_tools`.
# Без этих пакетов пакет не работает, поэтому они не являются опциональными.
# (torchvision, timm, plotly и пр. подтягиваются транзитивно через smp/optuna)
dependencies = [
    "numpy>=1.26.4",
    "torch>=2.5.0",
    "tqdm>=4.67.0",
    "opencv-python-headless>=4.10.0",
    "pillow>=10.0.0",
    "matplotlib>=3.9.0",
    "albumentations>=2.0.0",
    "segmentation-models-pytorch>=0.4.0",
    "torchmetrics>=1.9.0",
    "optuna>=3.6.0",
]

[tool.hatch.version]
path = "fast_ml_tools/_version.py"

[project.optional-dependencies]
# Логирование: mlflow импортируется только в logging.mlflow_utils
# и не требуется для базового `import fast_ml_tools`
logging = [
    "mlflow>=3.0.0",
    "boto3>=1.35.0",
    "sqlalchemy>=2.0.0",
]

# Полный набор
all = [
    "fast-ml-tools[logging]"
]

[tool.hatch.build.targets.wheel]
packages = ["fast_ml_tools"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
